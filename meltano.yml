version: 1
send_anonymous_usage_stats: true
project_id: "tap-iceberg"
plugins:
  extractors:
  - name: "tap-iceberg"
    namespace: "tap_iceberg"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    settings:
    - description: The name of the catalog to connect to.
      label: Catalog Name
      name: catalog_name
    - description: The type of catalog to connect to.
      label: Catalog Type
      name: catalog_type
    - description: The URI of the catalog to connect to.
      label: Catalog URI
      name: catalog_uri
    - description: Additional properties to pass to the catalog connection.
      label: Catalog Properties
      name: catalog_properties
    - description: The access key of the AWS Glue Data Catalog.
      label: Access Key
      name: client_access_key_id
    - description: The secret access key of the AWS Glue Data Catalog.
      label: Secret Access Key
      name: client_secret_access_key
    - description: The session token of the AWS Glue Data Catalog.
      label: Session Token
      name: client_session_token
    - description: The region of the AWS Glue Data Catalog.
      label: Region
      name: client_region
    - description: >-
        IRSA → intermediary role ARN (CUSTOMER_DATA_ACCESS_ROLE_ARN,
        TAP_ICEBERG_CUSTOMER_DATA_ACCESS_ROLE_ARN, or Meltano setting); required hop
        when the lake/Glue reader role trusts this principal, not pod identity alone.
      label: Customer data access role ARN
      name: customer_data_access_role_arn
    - description: >-
        Glue/lake reader role ARN (often customer account); second AssumeRole hop
        after customer_data_access_role_arn. Use without customer_* only when the
        reader role trust allows ambient IRSA callers.
      label: Client IAM role ARN (chained assume)
      name: client_iam_role_arn
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
